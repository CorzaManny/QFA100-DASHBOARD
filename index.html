<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080D13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QFA100 Ops">
  <meta name="description" content="WorldFlight 737 operations: checklists, live VATSIM tracking, schedule, tech log and airport briefings.">
  <title>QFA100 Ops</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/dashboard">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand-lines">
        <span class="tiny">WORLDFLIGHT · 737 OPERATIONS</span>
        <span class="brand-name">QFA100 Ops</span>
      </span>
    </a>
    <div class="top-right">
      <span class="clock">
        <span id="clock" aria-label="Zulu time">----Z</span>
        <span id="clock-sim" class="clock-sim" aria-label="Sim local time">----</span>
      </span>
      <div class="who">
        <button class="avatar" id="who-btn" aria-haspopup="true" aria-expanded="false" aria-label="Your account">
          <span id="who-initials">··</span>
        </button>
        <div class="menu" id="who-menu" role="menu" hidden>
          <div class="menu-head">
            <div class="menu-name" id="who-name"></div>
            <div class="tiny" id="who-role"></div>
          </div>
          <a role="menuitem" href="#/settings">Settings</a>
          <a role="menuitem" href="#/admin" id="who-admin">Admin</a>
          <button type="button" role="menuitem" id="who-out">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Main">
    <a href="#/dashboard" data-tab="dashboard">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="#/roster" data-tab="roster">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg>
      <span>Team Roster</span>
    </a>
    <a href="#/schedule" data-tab="schedule">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>WF Schedule</span>
    </a>
    <a href="#/checklists" data-tab="checklists">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5l2 2 3-3M3 12l2 2 3-3M3 19l2 2 3-3M12 6h9M12 13h9M12 20h9"/></svg>
      <span>Checklists</span>
    </a>
    <a href="#/progress" data-tab="progress">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
      <span>Logbook</span>
    </a>
    <a href="#/brief" data-tab="brief">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span>Briefings</span>
    </a>
    <a href="#/techlog" data-tab="techlog">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      <span>Tech Log</span>
    </a>
    <div class="nav-foot" aria-hidden="true">
      <span class="mark"></span>
      <span>QFA100<br>WORLDFLIGHT 2026</span>
    </div>
  </nav>

  <noscript><p style="padding:24px;color:#fff">QFA100 Ops needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
